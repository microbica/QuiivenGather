# Despliegue al ambiente de test (Lightsail 100.53.243.240).
# Se ejecuta en el runner self-hosted instalado en esa máquina:
# cada push a master valida (install/build/lint/test) y levanta docker compose.
# El ci.yml existente sigue validando todo push/PR en la nube (ubuntu-latest).
name: deploy-test
on:
  push:
    branches: [master]

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: [self-hosted, lightsail]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

      - name: Escribir .env de test (no se versiona)
        # Secrets de GitHub (Settings → Secrets → Actions). Para agregar uno
        # nuevo basta mapearlo en `env:` y añadir su nombre a SECRET_VARS.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_TEST }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_TEST }}
          GOOGLE_TOKEN_KEY: ${{ secrets.GOOGLE_TOKEN_KEY_TEST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          # Opcional: lectura de Airtable (equipos → escritorio automático).
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          APP_NAME=gatherQuiiven
          VITE_COLYSEUS_URL=wss://gather.quiiven.com
          VITE_MAP_DEFAULT=/maps/demo.tmj
          VITE_PROXIMITY_RADIUS_TILES=5
          VITE_AUTH_PROVIDER=none
          VITE_API_BASE=https://gather.quiiven.com
          VITE_CLERK_PUBLISHABLE_KEY=
          VITE_SUPABASE_URL=
          VITE_SUPABASE_ANON_KEY=
          SERVER_PORT=2567
          SERVER_CORS_ORIGIN=https://gather.quiiven.com
          GAME_PATCH_RATE=50
          GAME_MAX_CLIENTS=50
          LIVEKIT_URL=
          LIVEKIT_API_KEY=
          LIVEKIT_API_SECRET=
          TURN_SECRET=
          REDIS_URL=
          GOOGLE_REDIRECT_URI=https://gather.quiiven.com/auth/google/callback
          GOOGLE_ALLOWED_DOMAIN=quiiven.com
          GOOGLE_ALLOWED_EMAILS=
          GOOGLE_ADMIN_EMAIL=alejandro.moreno@quiiven.com
          AIRTABLE_BASE_ID=appL1aq6ivn3D2OaC
          AIRTABLE_USERS_TABLE=tblUcciENqoEXtVEu
          EOF
          # Inyección dinámica de secrets al .env (llega al container vía env_file).
          # Falla si alguno viene vacío para no desplegar a ciegas.
          SECRET_VARS="JWT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_TOKEN_KEY DATABASE_URL"
          missing=""
          for v in $SECRET_VARS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de GitHub:$missing"
            exit 1
          fi
          for v in $SECRET_VARS; do
            printf '%s=%s\n' "$v" "${!v}" >> .env
          done
          # Opcional (sin él no hay escritorio automático por equipo).
          if [ -n "$AIRTABLE_TOKEN" ]; then printf 'AIRTABLE_TOKEN=%s\n' "$AIRTABLE_TOKEN" >> .env; fi

      - name: Desplegar con Docker Compose
        run: docker compose up --build -d

      - name: Recargar Caddy (relee el Caddyfile montado)
        # El container de caddy no se recrea si su definición no cambia, y el
        # watch de archivo puede perderse tras un `git checkout`. Forzar reload
        # garantiza que la nueva config (rutas /matchmake, etc.) entré en vivo.
        run: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verificar despliegue
        run: |
          sleep 8
          curl -fsS http://localhost:5173/ -o /dev/null
          curl -fsS http://localhost:2567/health
          docker compose logs --tail=5 server
          docker compose ps
          curl -fsS --max-time 20 https://gather.quiiven.com/ -o /dev/null || echo "WARN: el dominio aún no responde (revisar DNS y firewall 80/443)"
