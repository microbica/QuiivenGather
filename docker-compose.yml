services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Vite los hornea en el build: sin esto el navegador usaría ws://localhost.
        VITE_COLYSEUS_URL: ${VITE_COLYSEUS_URL:-ws://100.53.243.240:2567}
        VITE_MAP_DEFAULT: ${VITE_MAP_DEFAULT:-/maps/demo.tmj}
        VITE_PROXIMITY_RADIUS_TILES: ${VITE_PROXIMITY_RADIUS_TILES:-5}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-none}
    ports:
      - "5173:5173"
    environment:
      # El navegador resuelve esto, no el container → IP test, no "server".
      - VITE_COLYSEUS_URL=${VITE_COLYSEUS_URL:-ws://100.53.243.240:2567}
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    ports:
      - "2567:2567"
    env_file:
      - .env
    environment:
      - SERVER_PORT=2567
      - SERVER_CORS_ORIGIN=${SERVER_CORS_ORIGIN:-http://100.53.243.240:5173}
    restart: unless-stopped
