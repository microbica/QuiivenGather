services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Vite los hornea en el build: sin esto el navegador usaría ws://localhost.
        VITE_COLYSEUS_URL: ${VITE_COLYSEUS_URL:-wss://gather.quiiven.com}
        VITE_MAP_DEFAULT: ${VITE_MAP_DEFAULT:-/maps/demo.tmj}
        VITE_PROXIMITY_RADIUS_TILES: ${VITE_PROXIMITY_RADIUS_TILES:-5}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-none}
        # API de Google en el navegador: sin esto defaulta a localhost y el login roto en remoto.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:2567}
    ports:
      - "5173:5173"
    environment:
      # El navegador resuelve esto, no el container → dominio, no "server".
      - VITE_COLYSEUS_URL=${VITE_COLYSEUS_URL:-wss://gather.quiiven.com}
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:2567}
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    ports:
      - "2567:2567"
    env_file:
      - .env
    environment:
      - SERVER_PORT=2567
      - SERVER_CORS_ORIGIN=${SERVER_CORS_ORIGIN:-https://gather.quiiven.com}
    volumes:
      # Tokens Google cifrados: sin esto cada redeploy desvincula todas las cuentas.
      - server_data:/app/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  server_data:
